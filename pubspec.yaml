name: winche_auth
description: Dart client for Winche Auth — email and password, anonymous, email-link, Google, Apple and OpenID Connect sign-in, with tokens refreshed for winche_database and winche_storage.
version: 0.1.0
repository: https://github.com/FlameOfUdun/winche-auth-dart-sdk
issue_tracker: https://github.com/FlameOfUdun/winche-auth-dart-sdk/issues

topics:
  - authentication
  - auth
  - jwt

environment:
  sdk: ^3.10.0

dependencies:
  winche_core: ^1.0.0
  meta: ^1.16.0

dev_dependencies:
  crypto: ^3.0.6
  http: ^1.2.0
  lints: ^6.0.0
  test: ^1.26.2
